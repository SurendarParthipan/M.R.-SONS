<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Parts Stock">
<meta name="theme-color" content="#17191b">
<title>Parts Stock — Family Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  /* ===================== DESIGN TOKENS ===================== */
  :root{
    --bg-0:#141617;
    --bg-1:#1c1f21;
    --bg-2:#25292c;
    --bg-3:#2e3336;
    --steel:#3c4247;
    --steel-lt:#565e64;
    --amber:#ffb400;
    --amber-dim:#8a6203;
    --red:#e6534d;
    --red-dim:#4a2321;
    --green:#4fae74;
    --green-dim:#1f3b2b;
    --text-0:#f2efe8;
    --text-1:#b9bfc3;
    --text-2:#7d858a;
    --radius:3px;
    --font-display:'Oswald',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg-0);
    background-image:
      repeating-linear-gradient(45deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 12px);
    color:var(--text-0);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:env(safe-area-inset-bottom);
  }
  @media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important;} }
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  ::selection{background:var(--amber);color:#1a1a1a;}

  /* ===================== LOGIN GATE ===================== */
  #loginScreen{
    position:fixed;inset:0;background:var(--bg-0);
    display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:18px;z-index:500;padding:24px;
  }
  .rivet-plate{
    width:64px;height:64px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--bg-3), var(--bg-1));
    border:2px solid var(--steel);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-size:22px;font-weight:700;
    color:var(--amber);letter-spacing:1px;
    box-shadow: inset 0 2px 3px rgba(255,255,255,0.05), 0 4px 12px rgba(0,0,0,0.4);
  }
  .login-title{font-family:var(--font-display);font-size:24px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;}
  .login-sub{color:var(--text-2);font-size:13px;letter-spacing:0.5px;margin-top:-12px;}
  #loginForm{display:flex;flex-direction:column;gap:12px;width:100%;max-width:280px;}
  #loginForm input{
    background:var(--bg-1);border:1px solid var(--steel);color:var(--text-0);
    padding:14px 16px;border-radius:var(--radius);font-size:16px;letter-spacing:1px;text-align:center;
  }
  #loginForm input:focus{outline:none;border-color:var(--amber);}
  .btn-amber{
    background:var(--amber);color:#1a1408;border:none;
    padding:14px 16px;border-radius:var(--radius);font-weight:700;
    font-size:14px;text-transform:uppercase;letter-spacing:1px;
    font-family:var(--font-display);
  }
  .btn-amber:active{transform:translateY(1px);}
  .login-error{color:var(--red);font-size:12px;text-align:center;min-height:14px;}

  /* ===================== APP SHELL ===================== */
  #app{display:none;min-height:100vh;flex-direction:column;}
  #app.active{display:flex;}

  header.topbar{
    position:sticky;top:0;z-index:50;
    background:linear-gradient(180deg, var(--bg-1) 0%, rgba(28,31,33,0.94) 100%);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--steel);
    padding:14px 16px 12px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{
    width:32px;height:32px;border-radius:50%;
    background:var(--bg-2);border:1.5px solid var(--amber-dim);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-weight:700;font-size:13px;color:var(--amber);
  }
  .brand-text{font-family:var(--font-display);font-size:16px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;}
  .brand-sub{font-size:10px;color:var(--text-2);letter-spacing:1.5px;text-transform:uppercase;margin-top:1px;}
  .sync-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);}
  .sync-dot.off{background:var(--text-2);box-shadow:none;}
  .topbar-right{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--text-2);}

  main{flex:1;padding:16px 16px 90px;max-width:640px;width:100%;margin:0 auto;}

  /* ===================== BOTTOM NAV ===================== */
  nav.bottomnav{
    position:fixed;bottom:0;left:0;right:0;z-index:50;
    background:var(--bg-1);border-top:1px solid var(--steel);
    display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom));
    gap:4px;
  }
  nav.bottomnav button{
    flex:1;background:none;border:none;color:var(--text-2);
    display:flex;flex-direction:column;align-items:center;gap:4px;
    padding:8px 4px;border-radius:var(--radius);font-size:10px;
    letter-spacing:0.5px;text-transform:uppercase;font-weight:600;
  }
  nav.bottomnav button.active{color:var(--amber);background:rgba(255,180,0,0.08);}
  nav.bottomnav svg{width:20px;height:20px;}

  .view{display:none;}
  .view.active{display:block;animation:fadeIn 0.25s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  /* ===================== DASHBOARD ===================== */
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;}
  .stat-card{
    background:var(--bg-1);border:1px solid var(--steel);border-radius:var(--radius);
    padding:14px;position:relative;overflow:hidden;
  }
  .stat-card::before{
    content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:var(--amber);
  }
  .stat-label{font-size:10px;color:var(--text-2);text-transform:uppercase;letter-spacing:1px;font-weight:600;}
  .stat-value{font-family:var(--font-mono);font-size:22px;font-weight:600;margin-top:6px;color:var(--text-0);}
  .section-label{
    font-family:var(--font-display);font-size:13px;font-weight:600;text-transform:uppercase;
    letter-spacing:1px;color:var(--text-1);margin:22px 0 10px;display:flex;align-items:center;gap:8px;
  }
  .section-label::after{content:'';flex:1;height:1px;background:var(--steel);}

  .activity-row{
    display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bg-2);
  }
  .activity-thumb{width:38px;height:38px;border-radius:var(--radius);background:var(--bg-2);object-fit:cover;flex-shrink:0;border:1px solid var(--steel);}
  .activity-info{flex:1;min-width:0;}
  .activity-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .activity-meta{font-size:11px;color:var(--text-2);margin-top:1px;}
  .activity-price{font-family:var(--font-mono);font-size:13px;color:var(--amber);}

  /* ===================== SEARCH / BROWSE ===================== */
  .search-bar{
    display:flex;gap:8px;margin-bottom:12px;
  }
  .search-bar input{
    flex:1;background:var(--bg-1);border:1px solid var(--steel);color:var(--text-0);
    padding:12px 14px;border-radius:var(--radius);font-size:14px;
  }
  .search-bar input:focus{outline:none;border-color:var(--amber);}
  .filter-scroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:12px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .filter-scroll::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0;background:var(--bg-1);border:1px solid var(--steel);color:var(--text-1);
    padding:7px 13px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap;
  }
  .chip.active{background:var(--amber);color:#1a1408;border-color:var(--amber);}

  .item-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .item-card{
    background:var(--bg-1);border:1px solid var(--steel);border-radius:var(--radius);
    overflow:hidden;position:relative;
  }
  .item-photo-wrap{position:relative;aspect-ratio:4/3;background:var(--bg-2);overflow:hidden;}
  .item-photo-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
  .item-photo-wrap.empty{display:flex;align-items:center;justify-content:center;color:var(--text-2);}
  .item-photo-wrap.empty svg{width:28px;height:28px;opacity:0.4;}
  .punch-hole{
    position:absolute;top:8px;left:8px;width:14px;height:14px;border-radius:50%;
    background:var(--bg-0);border:1px solid rgba(0,0,0,0.5);
  }
  .status-stamp{
    position:absolute;top:8px;right:-26px;transform:rotate(35deg);
    padding:3px 30px;font-family:var(--font-display);font-size:9px;font-weight:700;
    letter-spacing:1.5px;text-transform:uppercase;
  }
  .status-stamp.sold{background:var(--red);color:#fff;}
  .status-stamp.reserved{background:var(--amber);color:#1a1408;}
  .item-info{padding:10px;}
  .item-name{font-size:12.5px;font-weight:600;line-height:1.3;margin-bottom:4px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em;}
  .item-cat{font-size:10px;color:var(--text-2);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;}
  .item-price{font-family:var(--font-mono);font-size:14px;font-weight:600;color:var(--amber);}
  .empty-state{text-align:center;padding:60px 20px;color:var(--text-2);}
  .empty-state svg{width:40px;height:40px;opacity:0.3;margin-bottom:12px;}
  .empty-state p{font-size:13px;}

  /* ===================== ADD ITEM FORM ===================== */
  .form-group{margin-bottom:16px;}
  .form-label{font-size:11px;font-weight:600;color:var(--text-1);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:7px;display:block;}
  .form-input, .form-select, .form-textarea{
    width:100%;background:var(--bg-1);border:1px solid var(--steel);color:var(--text-0);
    padding:12px 14px;border-radius:var(--radius);font-size:15px;
  }
  .form-input:focus,.form-select:focus,.form-textarea:focus{outline:none;border-color:var(--amber);}
  .form-textarea{resize:vertical;min-height:60px;}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .pill-group{display:flex;gap:8px;flex-wrap:wrap;}
  .pill-option{
    flex:1;min-width:80px;text-align:center;background:var(--bg-1);border:1px solid var(--steel);
    color:var(--text-1);padding:10px 8px;border-radius:var(--radius);font-size:12px;font-weight:600;
  }
  .pill-option.selected{background:var(--amber);color:#1a1408;border-color:var(--amber);}

  .photo-upload-zone{
    border:1.5px dashed var(--steel);border-radius:var(--radius);padding:20px;
    text-align:center;color:var(--text-2);font-size:12px;background:var(--bg-1);
  }
  .photo-preview-grid{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .photo-preview{position:relative;width:64px;height:64px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--steel);}
  .photo-preview img{width:100%;height:100%;object-fit:cover;}
  .photo-remove{
    position:absolute;top:2px;right:2px;width:18px;height:18px;background:rgba(0,0,0,0.7);
    border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;border:none;
  }
  .submit-btn{width:100%;padding:15px;margin-top:6px;}

  /* ===================== ITEM DETAIL MODAL ===================== */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(10,11,12,0.75);z-index:200;
    display:none;align-items:flex-end;justify-content:center;
  }
  .modal-overlay.active{display:flex;}
  .modal-sheet{
    background:var(--bg-1);border-radius:14px 14px 0 0;width:100%;max-width:640px;
    max-height:90vh;overflow-y:auto;padding:0 0 24px;
    border-top:1px solid var(--steel);
    animation:slideUp 0.25s ease;
  }
  @keyframes slideUp{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .modal-drag{width:36px;height:4px;background:var(--steel-lt);border-radius:2px;margin:10px auto;}
  .modal-photos{display:flex;gap:2px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;}
  .modal-photos img{width:100%;flex-shrink:0;scroll-snap-align:start;aspect-ratio:4/3;object-fit:cover;}
  .modal-body{padding:18px 18px 0;}
  .modal-title-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .modal-title{font-family:var(--font-display);font-size:19px;font-weight:600;line-height:1.25;}
  .modal-price-tag{font-family:var(--font-mono);font-size:20px;color:var(--amber);font-weight:600;white-space:nowrap;}
  .modal-meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
  .meta-box{background:var(--bg-2);border-radius:var(--radius);padding:10px 12px;border:1px solid var(--bg-3);}
  .meta-box-label{font-size:9.5px;color:var(--text-2);text-transform:uppercase;letter-spacing:0.6px;}
  .meta-box-val{font-size:13px;font-weight:600;margin-top:3px;}
  .modal-notes{font-size:13px;color:var(--text-1);line-height:1.5;background:var(--bg-2);padding:12px;border-radius:var(--radius);border:1px solid var(--bg-3);}
  .modal-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:18px;}
  .action-btn{
    padding:12px 6px;border-radius:var(--radius);font-size:11px;font-weight:700;text-transform:uppercase;
    letter-spacing:0.5px;border:1px solid var(--steel);background:var(--bg-2);color:var(--text-1);
  }
  .action-btn.sold-btn{border-color:var(--green);color:var(--green);}
  .action-btn.edit-btn{border-color:var(--amber);color:var(--amber);}
  .action-btn.delete-btn{border-color:var(--red);color:var(--red);}
  .close-modal{position:absolute;top:14px;right:14px;background:rgba(0,0,0,0.4);border:none;color:var(--text-0);
    width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;z-index:2;}

  .toast{
    position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--bg-3);border:1px solid var(--steel);color:var(--text-0);
    padding:11px 20px;border-radius:20px;font-size:13px;font-weight:500;z-index:300;
    opacity:0;pointer-events:none;transition:all 0.25s ease;
    display:flex;align-items:center;gap:8px;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast-dot{width:6px;height:6px;border-radius:50%;background:var(--green);}

  .loading-spinner{width:16px;height:16px;border:2px solid var(--bg-3);border-top-color:var(--amber);
    border-radius:50%;animation:spin 0.7s linear infinite;display:inline-block;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .center-loading{display:flex;justify-content:center;padding:40px;}
</style>
</head>
<body>

<!-- ===================== LOGIN GATE ===================== -->
<div id="loginScreen">
  <div class="rivet-plate">PS</div>
  <div class="login-title">Parts Stock</div>
  <div class="login-sub">Family Inventory — Private</div>
  <form id="loginForm">
    <input type="text" id="userSelect" placeholder="Your name" autocomplete="off" required>
    <input type="password" id="passInput" placeholder="Access code" autocomplete="off" required>
    <button type="submit" class="btn-amber">Enter</button>
    <div class="login-error" id="loginError"></div>
  </form>
</div>

<!-- ===================== APP SHELL ===================== -->
<div id="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">PS</div>
      <div>
        <div class="brand-text">Parts Stock</div>
        <div class="brand-sub" id="userLabel">—</div>
      </div>
    </div>
    <div class="topbar-right">
      <span class="sync-dot" id="syncDot"></span>
      <span id="syncLabel">Live</span>
    </div>
  </header>

  <main>
    <!-- DASHBOARD -->
    <section class="view" id="view-dashboard">
      <div class="stat-grid">
        <div class="stat-card"><div class="stat-label">In Stock</div><div class="stat-value" id="statCount">0</div></div>
        <div class="stat-card"><div class="stat-label">Stock Value</div><div class="stat-value" id="statValue">RM 0</div></div>
      </div>
      <div class="section-label">Recently Added</div>
      <div id="recentAdded"><div class="center-loading"><span class="loading-spinner"></span></div></div>
      <div class="section-label">Recently Sold</div>
      <div id="recentSold"></div>
    </section>

    <!-- BROWSE -->
    <section class="view" id="view-browse">
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search parts, make, model...">
      </div>
      <div class="filter-scroll" id="categoryFilters"></div>
      <div class="item-grid" id="itemGrid"></div>
      <div class="empty-state" id="browseEmpty" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <p>No matching parts found</p>
      </div>
    </section>

    <!-- ADD ITEM -->
    <section class="view" id="view-add">
      <div class="form-group">
        <label class="form-label">Photos</label>
        <div class="photo-upload-zone" id="photoZone">
          <input type="file" id="photoInput" accept="image/*" capture="environment" multiple style="display:none;">
          <div onclick="document.getElementById('photoInput').click()">Tap to take photo or choose from gallery</div>
        </div>
        <div class="photo-preview-grid" id="photoPreviewGrid"></div>
      </div>

      <div class="form-group">
        <label class="form-label">Item Name</label>
        <input type="text" class="form-input" id="fName" placeholder="e.g. Hino 300 Engine Assembly">
      </div>

      <div class="form-group">
        <label class="form-label">Category</label>
        <div class="pill-group" id="categoryPills"></div>
      </div>

      <div class="form-group">
        <label class="form-label">Make / Model</label>
        <input type="text" class="form-input" id="fMakeModel" placeholder="e.g. Hino FC 300 (2015)">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Condition</label>
          <select class="form-select" id="fCondition">
            <option>Good</option>
            <option>Fair</option>
            <option>For Parts Only</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Quantity</label>
          <input type="number" class="form-input" id="fQty" value="1" min="1">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Price (RM)</label>
        <input type="number" class="form-input" id="fPrice" placeholder="0.00" step="0.01">
      </div>

      <div class="form-group">
        <label class="form-label">Location / Notes</label>
        <textarea class="form-textarea" id="fNotes" placeholder="e.g. Yard 2, back row. Minor rust on housing."></textarea>
      </div>

      <button class="btn-amber submit-btn" id="submitItemBtn">Add to Stock</button>
    </section>
  </main>

  <nav class="bottomnav">
    <button class="nav-btn active" data-view="dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 13h8V3H3v10zm10 8h8V11h-8v10zM3 21h8v-6H3v6zM13 3v6h8V3h-8z"/></svg>
      Home
    </button>
    <button class="nav-btn" data-view="browse">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      Browse
    </button>
    <button class="nav-btn" data-view="add">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>
      Add Item
    </button>
  </nav>
</div>

<!-- ITEM DETAIL MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-sheet" id="modalSheet"></div>
</div>

<div class="toast" id="toast"><span class="toast-dot"></span><span id="toastMsg"></span></div>

<script>
/* ============================================================
   CONFIG — fill these in after you create your Supabase project
   Get them from: Supabase Dashboard > Project Settings > API
   ============================================================ */
const SUPABASE_URL = "https://lyetticvgcuotsqnosne.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_tKihVhC4t-trpErrqUT-cw_E-qW-2a8";

// Shared access code for the app (change this to whatever you like)
const ACCESS_CODE = "PARTS2026";

// The 4 family members — shown as a dropdown-style quick pick
const FAMILY_MEMBERS = ["Surendar", "Brother 1", "Brother 2", "Father"];

const CATEGORIES = ["Engine","Cabin","Gearbox","Chassis","Electrical","Body Panel","Suspension","Axle","Other"];

/* ============================================================ */

let supabase = null;
let currentUser = null;
let allItems = [];
let activeCategory = "All";
let pendingPhotos = []; // {file, dataUrl}
let editingItemId = null;

function initSupabase(){
  if(SUPABASE_URL.includes("YOUR_") || SUPABASE_ANON_KEY.includes("YOUR_")){
    showToast("⚠ Supabase not configured yet");
    return false;
  }
  supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  return true;
}

/* ---------------- LOGIN ---------------- */
document.getElementById('loginForm').addEventListener('submit', (e)=>{
  e.preventDefault();
  const name = document.getElementById('userSelect').value.trim();
  const pass = document.getElementById('passInput').value.trim();
  const errEl = document.getElementById('loginError');
  if(pass !== ACCESS_CODE){
    errEl.textContent = "Wrong access code";
    return;
  }
  if(!name){
    errEl.textContent = "Enter your name";
    return;
  }
  currentUser = name;
  document.getElementById('userLabel').textContent = name;
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').classList.add('active');
  boot();
});

/* ---------------- BOOT ---------------- */
function boot(){
  renderCategoryPills();
  renderCategoryFilters();
  const ok = initSupabase();
  document.getElementById('syncDot').classList.toggle('off', !ok);
  document.getElementById('syncLabel').textContent = ok ? 'Live' : 'Offline';
  if(ok){
    loadItems();
    subscribeRealtime();
  }
}

async function loadItems(){
  const { data, error } = await supabase.from('items').select('*').order('created_at', {ascending:false});
  if(error){ showToast('Load error: ' + error.message); return; }
  allItems = data || [];
  renderDashboard();
  renderBrowse();
}

function subscribeRealtime(){
  supabase.channel('items-changes')
    .on('postgres_changes', {event:'*', schema:'public', table:'items'}, (payload)=>{
      loadItems();
      if(payload.eventType === 'INSERT' && payload.new.added_by !== currentUser){
        showToast(`${payload.new.added_by} added ${payload.new.name}`);
      }
    })
    .subscribe();
}

/* ---------------- NAV ---------------- */
document.querySelectorAll('.nav-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    document.getElementById('view-' + btn.dataset.view).classList.add('active');
  });
});

/* ---------------- DASHBOARD ---------------- */
function renderDashboard(){
  const inStock = allItems.filter(i=>i.status === 'In Stock');
  const totalValue = inStock.reduce((sum,i)=> sum + (Number(i.price)||0) * (i.quantity||1), 0);
  document.getElementById('statCount').textContent = inStock.length;
  document.getElementById('statValue').textContent = 'RM ' + totalValue.toLocaleString('en-MY', {maximumFractionDigits:0});

  const recentAdded = [...allItems].sort((a,b)=> new Date(b.created_at) - new Date(a.created_at)).slice(0,5);
  document.getElementById('recentAdded').innerHTML = recentAdded.length
    ? recentAdded.map(activityRow).join('')
    : `<p style="color:var(--text-2);font-size:12px;">No items yet — add your first one</p>`;

  const recentSold = allItems.filter(i=>i.status==='Sold').sort((a,b)=> new Date(b.sold_at||0) - new Date(a.sold_at||0)).slice(0,5);
  document.getElementById('recentSold').innerHTML = recentSold.length
    ? recentSold.map(activityRow).join('')
    : `<p style="color:var(--text-2);font-size:12px;">Nothing sold yet</p>`;

  document.querySelectorAll('.activity-row').forEach(row=>{
    row.addEventListener('click', ()=> openItemModal(row.dataset.id));
  });
}

function activityRow(item){
  const photo = (item.photos && item.photos[0]) ? item.photos[0] : null;
  return `
  <div class="activity-row" data-id="${item.id}">
    ${photo ? `<img class="activity-thumb" src="${photo}">` : `<div class="activity-thumb"></div>`}
    <div class="activity-info">
      <div class="activity-name">${escapeHtml(item.name)}</div>
      <div class="activity-meta">${escapeHtml(item.category)} · ${escapeHtml(item.added_by||'')}</div>
    </div>
    <div class="activity-price">RM ${Number(item.price||0).toLocaleString()}</div>
  </div>`;
}

/* ---------------- BROWSE ---------------- */
function renderCategoryFilters(){
  const wrap = document.getElementById('categoryFilters');
  const cats = ["All", ...CATEGORIES];
  wrap.innerHTML = cats.map(c=> `<button class="chip ${c===activeCategory?'active':''}" data-cat="${c}">${c}</button>`).join('');
  wrap.querySelectorAll('.chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      activeCategory = chip.dataset.cat;
      wrap.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      renderBrowse();
    });
  });
}

document.getElementById('searchInput').addEventListener('input', renderBrowse);

function renderBrowse(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  let filtered = allItems.filter(i=>{
    const matchesCat = activeCategory === 'All' || i.category === activeCategory;
    const matchesQ = !q || (i.name||'').toLowerCase().includes(q) || (i.make_model||'').toLowerCase().includes(q) || (i.category||'').toLowerCase().includes(q);
    return matchesCat && matchesQ;
  });
  const grid = document.getElementById('itemGrid');
  document.getElementById('browseEmpty').style.display = filtered.length ? 'none' : 'block';
  grid.innerHTML = filtered.map(itemCard).join('');
  grid.querySelectorAll('.item-card').forEach(card=>{
    card.addEventListener('click', ()=> openItemModal(card.dataset.id));
  });
}

function itemCard(item){
  const photo = (item.photos && item.photos[0]) ? item.photos[0] : null;
  const stamp = item.status === 'Sold' ? `<div class="status-stamp sold">Sold</div>`
              : item.status === 'Reserved' ? `<div class="status-stamp reserved">Reserved</div>` : '';
  return `
  <div class="item-card" data-id="${item.id}">
    <div class="item-photo-wrap ${photo?'':'empty'}">
      <div class="punch-hole"></div>
      ${photo ? `<img src="${photo}">` : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg>`}
      ${stamp}
    </div>
    <div class="item-info">
      <div class="item-name">${escapeHtml(item.name)}</div>
      <div class="item-cat">${escapeHtml(item.category)}</div>
      <div class="item-price">RM ${Number(item.price||0).toLocaleString()}</div>
    </div>
  </div>`;
}

/* ---------------- ADD ITEM FORM ---------------- */
function renderCategoryPills(){
  const wrap = document.getElementById('categoryPills');
  wrap.innerHTML = CATEGORIES.map(c=> `<button type="button" class="pill-option" data-cat="${c}">${c}</button>`).join('');
  wrap.querySelectorAll('.pill-option').forEach(p=>{
    p.addEventListener('click', ()=>{
      wrap.querySelectorAll('.pill-option').forEach(o=>o.classList.remove('selected'));
      p.classList.add('selected');
    });
  });
}

document.getElementById('photoInput').addEventListener('change', async (e)=>{
  const files = Array.from(e.target.files);
  for(const file of files){
    const compressed = await compressImage(file);
    pendingPhotos.push(compressed);
  }
  renderPhotoPreviews();
  e.target.value = '';
});

function renderPhotoPreviews(){
  const grid = document.getElementById('photoPreviewGrid');
  grid.innerHTML = pendingPhotos.map((p, idx)=> `
    <div class="photo-preview">
      <img src="${p.dataUrl}">
      <button class="photo-remove" data-idx="${idx}" type="button">✕</button>
    </div>`).join('');
  grid.querySelectorAll('.photo-remove').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      pendingPhotos.splice(Number(btn.dataset.idx), 1);
      renderPhotoPreviews();
    });
  });
}

function compressImage(file){
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 1280;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob((blob)=>{
          resolve({ file: blob, dataUrl: canvas.toDataURL('image/jpeg', 0.72) });
        }, 'image/jpeg', 0.72);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

document.getElementById('submitItemBtn').addEventListener('click', async ()=>{
  if(!supabase){ showToast('Supabase not configured yet'); return; }
  const name = document.getElementById('fName').value.trim();
  const selectedCat = document.querySelector('#categoryPills .selected');
  if(!name){ showToast('Enter an item name'); return; }
  if(!selectedCat){ showToast('Pick a category'); return; }

  const btn = document.getElementById('submitItemBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="loading-spinner"></span> Uploading...';

  try{
    const photoUrls = [];
    for(const p of pendingPhotos){
      const path = `${Date.now()}-${Math.random().toString(36).slice(2)}.jpg`;
      const { error: upErr } = await supabase.storage.from('item-photos').upload(path, p.file, {contentType:'image/jpeg'});
      if(upErr) throw upErr;
      const { data: urlData } = supabase.storage.from('item-photos').getPublicUrl(path);
      photoUrls.push(urlData.publicUrl);
    }

    const record = {
      name,
      category: selectedCat.dataset.cat,
      make_model: document.getElementById('fMakeModel').value.trim(),
      condition: document.getElementById('fCondition').value,
      price: parseFloat(document.getElementById('fPrice').value) || 0,
      quantity: parseInt(document.getElementById('fQty').value) || 1,
      location_notes: document.getElementById('fNotes').value.trim(),
      status: 'In Stock',
      added_by: currentUser,
      photos: photoUrls
    };

    if(editingItemId){
      const { error } = await supabase.from('items').update(record).eq('id', editingItemId);
      if(error) throw error;
      showToast('Item updated');
    } else {
      const { error } = await supabase.from('items').insert(record);
      if(error) throw error;
      showToast('Item added to stock');
    }

    resetForm();
    document.querySelector('.nav-btn[data-view="browse"]').click();
  }catch(err){
    showToast('Error: ' + err.message);
  }finally{
    btn.disabled = false;
    btn.textContent = 'Add to Stock';
  }
});

function resetForm(){
  document.getElementById('fName').value = '';
  document.getElementById('fMakeModel').value = '';
  document.getElementById('fPrice').value = '';
  document.getElementById('fQty').value = '1';
  document.getElementById('fNotes').value = '';
  document.getElementById('fCondition').value = 'Good';
  document.querySelectorAll('#categoryPills .pill-option').forEach(p=>p.classList.remove('selected'));
  pendingPhotos = [];
  renderPhotoPreviews();
  editingItemId = null;
  document.getElementById('submitItemBtn').textContent = 'Add to Stock';
}

/* ---------------- ITEM DETAIL MODAL ---------------- */
function openItemModal(id){
  const item = allItems.find(i=> i.id === id);
  if(!item) return;
  const photos = item.photos && item.photos.length ? item.photos : [];
  const sheet = document.getElementById('modalSheet');
  sheet.innerHTML = `
    <button class="close-modal" id="closeModalBtn">✕</button>
    <div class="modal-drag"></div>
    ${photos.length ? `<div class="modal-photos">${photos.map(p=>`<img src="${p}">`).join('')}</div>` : ''}
    <div class="modal-body">
      <div class="modal-title-row">
        <div class="modal-title">${escapeHtml(item.name)}</div>
        <div class="modal-price-tag">RM ${Number(item.price||0).toLocaleString()}</div>
      </div>
      <div class="modal-meta-grid">
        <div class="meta-box"><div class="meta-box-label">Category</div><div class="meta-box-val">${escapeHtml(item.category)}</div></div>
        <div class="meta-box"><div class="meta-box-label">Condition</div><div class="meta-box-val">${escapeHtml(item.condition)}</div></div>
        <div class="meta-box"><div class="meta-box-label">Make / Model</div><div class="meta-box-val">${escapeHtml(item.make_model || '—')}</div></div>
        <div class="meta-box"><div class="meta-box-label">Quantity</div><div class="meta-box-val">${item.quantity}</div></div>
        <div class="meta-box"><div class="meta-box-label">Status</div><div class="meta-box-val">${escapeHtml(item.status)}</div></div>
        <div class="meta-box"><div class="meta-box-label">Added by</div><div class="meta-box-val">${escapeHtml(item.added_by||'—')}</div></div>
      </div>
      ${item.location_notes ? `<div class="modal-notes">${escapeHtml(item.location_notes)}</div>` : ''}
      <div class="modal-actions">
        <button class="action-btn sold-btn" id="markSoldBtn">${item.status==='Sold' ? 'Mark In Stock' : 'Mark Sold'}</button>
        <button class="action-btn edit-btn" id="editItemBtn">Edit</button>
        <button class="action-btn delete-btn" id="deleteItemBtn">Delete</button>
      </div>
    </div>`;
  document.getElementById('modalOverlay').classList.add('active');
  document.getElementById('closeModalBtn').addEventListener('click', closeModal);

  document.getElementById('markSoldBtn').addEventListener('click', async ()=>{
    const newStatus = item.status === 'Sold' ? 'In Stock' : 'Sold';
    const { error } = await supabase.from('items').update({ status:newStatus, sold_at: newStatus==='Sold' ? new Date().toISOString() : null }).eq('id', item.id);
    if(error){ showToast('Error: ' + error.message); return; }
    showToast(newStatus === 'Sold' ? 'Marked as sold' : 'Marked back in stock');
    closeModal();
  });

  document.getElementById('editItemBtn').addEventListener('click', ()=>{
    editingItemId = item.id;
    document.getElementById('fName').value = item.name;
    document.getElementById('fMakeModel').value = item.make_model || '';
    document.getElementById('fCondition').value = item.condition;
    document.getElementById('fPrice').value = item.price;
    document.getElementById('fQty').value = item.quantity;
    document.getElementById('fNotes').value = item.location_notes || '';
    document.querySelectorAll('#categoryPills .pill-option').forEach(p=>{
      p.classList.toggle('selected', p.dataset.cat === item.category);
    });
    pendingPhotos = [];
    renderPhotoPreviews();
    document.getElementById('submitItemBtn').textContent = 'Save Changes';
    closeModal();
    document.querySelector('.nav-btn[data-view="add"]').click();
  });

  document.getElementById('deleteItemBtn').addEventListener('click', async ()=>{
    if(!confirm(`Delete "${item.name}"? This can't be undone.`)) return;
    const { error } = await supabase.from('items').delete().eq('id', item.id);
    if(error){ showToast('Error: ' + error.message); return; }
    showToast('Item deleted');
    closeModal();
  });
}

function closeModal(){
  document.getElementById('modalOverlay').classList.remove('active');
}
document.getElementById('modalOverlay').addEventListener('click', (e)=>{
  if(e.target.id === 'modalOverlay') closeModal();
});

/* ---------------- UTIL ---------------- */
function showToast(msg){
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=> t.classList.remove('show'), 2600);
}
function escapeHtml(str){
  if(!str) return '';
  return str.replace(/[&<>"']/g, m=> ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
</script>
